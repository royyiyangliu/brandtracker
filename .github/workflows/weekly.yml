name: Weekly price scrape

on:
  schedule:
    # Every Monday 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch: {}
  # 不再用 push 触发：代码改动 push 到 main 不会再自动跑全量抓取，
  # 避免频繁改仓库时反复爬。需要立即跑就在 Actions 页手动 Run workflow。

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 宝诗龙用自带 Chromium；卡地亚必须用真实 Chrome（channel=chrome）——两个都装。
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m playwright install chrome

      # 每个品牌一步、各自提交：抓取逻辑互相独立，一个品牌挂掉不影响另一个已提交的数据。
      # 先宝诗龙、后卡地亚；卡地亚那步用 if: always() 保证即使宝诗龙失败也照跑。
      - name: Scrape Boucheron
        run: xvfb-run -a python -m src.run config/boucheron.yaml

      - name: Commit Boucheron
        if: always()
        run: |
          git config user.name  "brandtracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -f data/prices.db docs/data.json
          git commit -m "chore: weekly snapshot Boucheron $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "push skipped"

      - name: Scrape Cartier
        if: always()
        run: xvfb-run -a python -m src.run config/cartier.yaml

      - name: Commit Cartier
        if: always()
        run: |
          git config user.name  "brandtracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -f data/prices.db docs/data.json
          git commit -m "chore: weekly snapshot Cartier $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "push skipped"

      - name: Scrape Van Cleef & Arpels
        if: always()
        run: xvfb-run -a python -m src.run config/vca.yaml

      - name: Commit Van Cleef & Arpels
        if: always()
        run: |
          git config user.name  "brandtracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -f data/prices.db docs/data.json
          git commit -m "chore: weekly snapshot VCA $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "push skipped"

      # NOTE: 数据中心 IP 若被 Akamai 拦（开始 403），给 Playwright 接住宅代理
      # （在 adapter 的 launch/new_context 加 proxy=，用仓库 Secret 注入）。
