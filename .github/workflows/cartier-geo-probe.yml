name: Cartier geo probe (one-off)

# 一次性探针：在 GitHub 美国 runner 上测卡地亚 7 国 locale 是否可直连。
# 不抓数据、不写仓库；只打印状态码 / 货号数 / runner 出口 IP 归属。
# 用完即删本文件。手动触发：Actions 页 -> 本工作流 -> Run workflow（或 gh workflow run）。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Show runner egress IP geo
        run: curl -s https://ipinfo.io || true

      - name: Probe Cartier locales
        run: |
          cat > probe.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36")
          HEADERS = {
              "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "accept-language": "en-US,en;q=0.9",
              "sec-ch-ua": '"Chromium";v="145", "Not(A:Brand";v="24", "Google Chrome";v="145"',
              "sec-ch-ua-mobile": "?0", "sec-ch-ua-platform": '"Windows"',
          }
          STEALTH = ("Object.defineProperty(navigator,'webdriver',{get:()=>undefined});"
                     "window.chrome={runtime:{}};")

          # 每国给几个候选 slug；命中 200 且有货号即停。
          TARGETS = [
              ("US", "en-US,en;q=0.9", ["https://www.cartier.com/en-us/jewelry/rings/"]),
              ("SG", "en-SG,en;q=0.9", ["https://www.cartier.com/en-sg/jewellery/rings/",
                                         "https://www.cartier.com/en-sg/jewelry/rings/"]),
              ("HK", "en-HK,en;q=0.9", ["https://www.cartier.com/en-hk/jewellery/rings/",
                                         "https://www.cartier.com/zh-hk/jewellery/rings/"]),
              ("JP", "ja-JP,ja;q=0.9,en;q=0.8", ["https://www.cartier.com/ja-jp/jewellery/rings/",
                                         "https://www.cartier.com/ja-jp/jewelry/rings/"]),
              ("KR", "ko-KR,ko;q=0.9,en;q=0.8", ["https://www.cartier.com/ko-kr/jewellery/rings/",
                                         "https://www.cartier.com/ko-kr/jewelry/rings/"]),
              ("FR", "fr-FR,fr;q=0.9,en;q=0.8", ["https://www.cartier.com/fr-fr/joaillerie/bagues/",
                                         "https://www.cartier.com/fr-fr/jewellery/rings/"]),
              ("CN", "zh-CN,zh;q=0.9,en;q=0.8", ["https://www.cartier.cn/zh-cn/jewellery/rings/",
                                         "https://www.cartier.cn/"]),
          ]

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True,
                                    args=["--disable-blink-features=AutomationControlled"])
              for code, lang, urls in TARGETS:
                  for u in urls:
                      h = dict(HEADERS); h["accept-language"] = lang
                      c = b.new_context(user_agent=UA, viewport={"width":1440,"height":900},
                                        extra_http_headers=h)
                      c.add_init_script(STEALTH)
                      pg = c.new_page()
                      try:
                          r = pg.goto(u, wait_until="domcontentloaded", timeout=60000)
                          st = r.status if r else None
                          pg.wait_for_timeout(2500)
                          info = pg.evaluate("""()=>{
                              const s=new Set();
                              for(const a of document.querySelectorAll('a[href]')){
                                const m=(a.getAttribute('href')||'').match(/CR[A-Z]\\d{7}/);
                                if(m)s.add(m[0]);}
                              const txt=document.body.innerText||'';
                              const cur=(txt.match(/HK\\$|S\\$|[$€£¥₩]|円|원/)||[])[0]||null;
                              const tot=(txt.match(/\\d+\\s*of\\s*\\d+/i)||[])[0]||null;
                              const grid=[...document.querySelectorAll('[data-url]')]
                                .map(e=>e.getAttribute('data-url'))
                                .find(x=>x&&/Search-UpdateGrid/.test(x))||null;
                              return {refs:s.size, cur, tot, grid};
                          }""")
                          print(f"[{code}] {st}  refs={info['refs']}  cur={info['cur']}  tot={info['tot']}")
                          print(f"      url={u}")
                          print(f"      final={pg.url}")
                          if info['grid']:
                              print(f"      grid={info['grid'][:140]}")
                          c.close()
                          if st == 200 and info['refs']:
                              break
                      except Exception as e:
                          print(f"[{code}] ERROR {u} -> {type(e).__name__}: {str(e)[:70]}")
                          c.close()
              b.close()
          PY
          xvfb-run -a python probe.py
